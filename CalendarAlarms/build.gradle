apply plugin: 'com.android.application'

android {
    compileSdk 35

    defaultConfig {
        applicationId "au.bethesque.calendaralarms"
        minSdkVersion 21
        targetSdkVersion 35
        /* major×10000 + minor×100 + patch */
        versionCode 200
        versionName '0.2.0'
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
        // Override with -PcalendarAlarmsUrl=... or in ~/.gradle/gradle.properties
        buildConfigField 'String', 'DEFAULT_CALENDAR_ALARMS_URL',
                "\"${project.findProperty('calendarAlarmsUrl') ?: 'http://nas.dixon.net.au:8442'}\""
        externalNativeBuild {
            cmake {
                version "3.22.1"
                cppFlags "-std=c++14"
                arguments '-DANDROID_STL=c++_static', '-DBUILD_SERVER=OFF', '-DBUILD_TESTS=OFF', \
                          '-DCMAKE_EXE_LINKER_FLAGS=-Wl,-z,max-page-size=16384', \
                          '-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384'
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            }
        }
    }
    buildFeatures {
        prefab true
        buildConfig true
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/snapcast/CMakeLists.txt'
        }
    }

    buildToolsVersion = '35.0.0'
    ndkVersion '27.0.12077973'
    lint {
        disable 'MissingTranslation'
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
    namespace 'au.bethesque.calendaralarms'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    signingConfigs {
        release {
            if (project.hasProperty('CALENDARALARMS_STORE_FILE')) {
                storeFile file(CALENDARALARMS_STORE_FILE)
                storePassword CALENDARALARMS_STORE_PASSWORD
                keyAlias CALENDARALARMS_KEY_ALIAS
                keyPassword CALENDARALARMS_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            // Installs alongside the release build, which is signed with a different key
            applicationIdSuffix '.dev'
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

}

tasks.register('applySnapcastPatches') {
    doLast {
        def submoduleDir = file('src/main/cpp/snapcast')
        def patchDir = file('patches')
        patchDir.listFiles().findAll { it.name.endsWith('.patch') }.sort { it.name }.each { patch ->
            def alreadyApplied = new ByteArrayOutputStream().withStream { err ->
                exec {
                    commandLine 'git', '-C', submoduleDir, 'apply', '--reverse', '--check', patch
                    ignoreExitValue = true
                    errorOutput = err
                }.exitValue == 0
            }
            if (alreadyApplied) {
                logger.info("Snapcast patch already applied: ${patch.name}")
            } else {
                exec {
                    commandLine 'git', '-C', submoduleDir, 'apply', patch
                }
                logger.lifecycle("Applied Snapcast patch: ${patch.name}")
            }
        }
    }
}

tasks.whenTaskAdded { task ->
    if (task.name.startsWith('externalNativeBuild') || task.name.startsWith('configureCmake') || task.name.startsWith('buildCMake')) {
        task.dependsOn applySnapcastPatches
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
    // https://dl.google.com/dl/android/maven2/index.html
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.work:work-runtime:2.10.1'
    // compile 'com.android.support:recyclerview-v7:23.1.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.github.badaix:oboe:1.9.0@aar'
    implementation 'com.github.badaix:boost:1.85.0@aar'
    implementation 'com.github.badaix:flac:1.4.2@aar'
    implementation 'com.github.badaix:ogg:1.3.5@aar'
    implementation 'com.github.badaix:opus:1.1.2@aar'
    implementation 'com.github.badaix:soxr:0.1.3@aar'
    implementation 'com.github.badaix:tremor:1.0.1@aar'
    implementation 'com.github.badaix:vorbis:1.3.7@aar'
}


repositories{
    flatDir{
        dirs 'libs'
    }

    maven {
        name = "GithubPackages"
        url = uri("https://maven.pkg.github.com/badaix/snapcast-deps")
        credentials {
            username = project.findProperty("GITHUB_USER") ?: System.getenv("GITHUB_USER")
            password = project.findProperty("GITHUB_TOKEN") ?: System.getenv("GITHUB_TOKEN")
        }
    }
}
